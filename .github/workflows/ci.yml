name: ci-linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Studio build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint studio frontend
        run: npm run lint
      - name: Build studio
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev

  studio-backend:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.10.27"
            name: Studio backend tests
            floor: true
          - core: "2026.11.14"
            name: Studio startup and project contracts (2026.11.14)
            floor: false
    env:
      CALC_FLOW_TEST_VERSION: ${{ matrix.core }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        if: matrix.floor
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install Studio with the published core wheel
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python --only-binary calc-flow-python \
            --constraint web-ui/api-schema-constraints.txt \
            --editable 'web-ui/backend[dev]' "calc-flow-python==$CALC_FLOW_TEST_VERSION"
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          from os import environ

          installed = version("calc-flow-python")
          print(f"calc-flow-python {installed}")
          assert installed == environ["CALC_FLOW_TEST_VERSION"]
          PY
      - name: Run studio backend coverage
        if: matrix.floor
        timeout-minutes: 15
        working-directory: web-ui/backend
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          uv run --no-sync --project . pytest -vv -o faulthandler_timeout=60
          --cov=calc_flow_studio --cov-report=term-missing --cov-report=xml
      - name: Verify startup and project contracts with the newer wheel
        if: ${{ !matrix.floor }}
        timeout-minutes: 15
        working-directory: web-ui/backend
        run: >-
          uv run --no-sync --project . pytest -vv -o faulthandler_timeout=60
          tests/test_app.py tests/test_models.py tests/test_late_output_contract.py
          tests/test_stream_asof_contract.py tests/test_stream_join_validation.py
          tests/test_previews.py tests/test_jobs_v3.py
          -k 'test_openapi_contains or test_project_crud or test_project_body_errors
          or test_project_structure_rejections or test_project_create_request
          or test_project_write or test_import_export
          or test_stream_asof_contract or test_stream_join_validation or test_late_openapi
          or test_raw_late_requests or test_late_policy_errors or test_previews or test_jobs_v3'
      - name: Verify generated API contract
        if: matrix.floor
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run sync:api
          git diff --exit-code -- schemas/project-v3.schema.json web-ui/openapi.json web-ui/src/api/schema.d.ts
      - name: Upload studio coverage report
        if: matrix.floor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-python-coverage
          path: web-ui/backend/coverage.xml
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    name: Studio browser workflow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install backend
        working-directory: .
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python --only-binary calc-flow-python \
            --constraint web-ui/api-schema-constraints.txt \
            --editable web-ui/backend calc-flow-python==2026.10.27
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web-ui/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        run: npm run test:e2e

  studio-package:
    name: Build + isolated studio wheel smoke test
    needs:
      - frontend
      - studio-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Build studio wheel
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run build
          uv build --project web-ui/backend --wheel --out-dir dist
      - name: Install and inspect studio wheels
        run: |
          for core_version in 2026.10.27 2026.11.14; do
            wheel_env="$RUNNER_TEMP/calc-flow-studio-wheel-$core_version"
            uv venv --python 3.13 "$wheel_env"
            uv pip install --python "$wheel_env/bin/python" --only-binary calc-flow-python \
              --constraint web-ui/api-schema-constraints.txt \
              "calc-flow-python==$core_version" dist/calc_flow_studio-*.whl packaging
            test -x "$wheel_env/bin/calc-flow-web"
            "$wheel_env/bin/python" - "$core_version" <<'PY'
          import sys
          import tomllib
          from importlib.metadata import requires, version
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import calc_flow
          import calc_flow_studio
          from packaging.requirements import Requirement

          with TemporaryDirectory() as directory:
              root = Path(directory)
              app = calc_flow_studio.create_app(
                  project_directory=root / "projects",
                  checkpoint_directory=root / "checkpoints",
              )
              paths = [route.path for route in app.routes]
              assert {"/api/v3/catalog", "/api/v3/projects", "/api/v3/previews",
                      "/api/v3/jobs"} <= app.openapi()["paths"].keys()
          assert "/" in paths
          assert "/assets" in paths
          assert not hasattr(calc_flow, "web")
          with Path("web-ui/backend/pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)["project"]
          assert version("calc-flow-studio") == project["version"]
          expected_core = next(
              Requirement(item) for item in project["dependencies"]
              if Requirement(item).name == "calc-flow-python"
          )
          core_requirements = requires("calc-flow-python") or []
          studio_requirements = requires("calc-flow-studio") or []
          assert not any("fastapi" in item.lower() for item in core_requirements)
          assert not any("uvicorn" in item.lower() for item in core_requirements)
          assert expected_core in [Requirement(item) for item in studio_requirements]
          assert version("calc-flow-python") == sys.argv[1]
          assert version("calc-flow-python") in expected_core.specifier
          index = next(route for route in app.routes if route.path == "/").endpoint()
          assert Path(index.path).is_file()
          PY
          done
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-python-distributions
          path: dist/calc_flow_studio-*.whl
          if-no-files-found: error
          retention-days: 30
